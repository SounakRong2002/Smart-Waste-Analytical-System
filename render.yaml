services:
  - type: web
    name: smart-waste-analytical-system
    runtime: python
    buildCommand: python -m pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py check --deploy
    startCommand: python manage.py migrate && python manage.py import_food_waste && gunicorn smart_waste_analytical_system.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-waste-database
          property: connectionString

databases:
  - name: smart-waste-database
    databaseName: smart_waste
    user: smart_waste
    plan: free
